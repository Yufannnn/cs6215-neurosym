[project]
name = "neurosym"
version = "0.1.0"
description = "CS6215 course project: symbolic static-analysis baseline vs a self-designed neuro-symbolic analyzer"
requires-python = ">=3.11"
dependencies = ["openai>=1.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neurosym = ["prompts/*"]
